spring:
  application:
    name: delivery-tracker-api
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:delivery_tracker}
    username: ${DB_USERNAME:delivery}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  jwt:
    issuer: ${JWT_ISSUER:delivery-tracker-api}
    private-key: ${JWT_PRIVATE_KEY:file:./secrets/private.pem}
    public-key: ${JWT_PUBLIC_KEY:file:./secrets/public.pem}
    ttl-seconds: ${JWT_TTL_SECONDS:3600}
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    persist-authorization: false
    disable-swagger-default-url: true
  paths-to-match: /api/v1/**
  override-with-generic-response: false
  default-produces-media-type: application/json
